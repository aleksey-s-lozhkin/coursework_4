{% extends 'base.html' %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3 class="card-title">Письмо отправлено</h3>
            </div>
            <div class="card-body text-center">
                <p class="lead">Мы отправили вам инструкцию по сбросу пароля на email.</p>
                <p>Если вы не получили письмо, проверьте папку "Спам".</p>

                <div class="mt-4">
                    <a href="{% url 'users:login' %}" class="btn btn-primary">Вернуться к входу</a>
                    <a href="{% url 'users:home' %}" class="btn btn-outline-primary">На главную</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
