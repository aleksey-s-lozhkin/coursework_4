{% extends 'base.html' %}

{% block title %}Удаление клиента{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h3 class="card-title">Подтверждение удаления</h3>
            </div>
            <div class="card-body">
                <p>Вы уверены, что хотите удалить клиента <strong>{{ client.full_name }}</strong> ({{ client.email }})?</p>
                <p class="text-danger">Это действие нельзя отменить!</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <div>
                            <a href="{% url 'clients:detail' client.pk %}" class="btn btn-secondary">Отмена</a>
                            <a href="{% url 'users:home' %}" class="btn btn-outline-primary">На главную</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
